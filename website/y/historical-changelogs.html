<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="historical_changelog_title">JTools - Historical Release Notes</title>
    <link rel="icon" type="image/png" href="/512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css?v=3">
    <script src="/scripts/components.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <jtool-navbar></jtool-navbar>

    <main class="container flex-grow-1" style="padding-top: 100px;">
        <header class="custom-card p-4 text-center my-4 shadow-sm">
            <div class="mb-2">
                <a href="/changelog" class="text-info text-decoration-none fw-semibold d-inline-flex align-items-center gap-1">
                    <span class="material-icons fs-6">arrow_back</span> <span data-i18n="back_to_current_changelog">Current Release Notes</span>
                </a>
            </div>
            <h1 class="display-5 fw-bold mb-2"><span class="text-info">J</span>Tools Historical Release Notes</h1>
            <p class="lead text-secondary mx-auto mb-4" style="max-width: 650px;" data-i18n="historical_changelog_subtitle">
                Explore archive notes and release history from previous JTools versions.
            </p>

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-surface border-end-0 text-secondary">
                            <span class="material-icons">search</span>
                        </span>
                        <input type="text" id="historicalSearchInput" class="form-control border-start-0 ps-0" placeholder="Search version, feature, or bug fix..." oninput="filterHistoricalNotes()">
                    </div>
                </div>
            </div>
        </header>

        <section class="my-4">
            <div id="versionTabs" class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                <!-- Version buttons populated dynamically -->
            </div>

            <div id="historicalChangelogContainer" class="d-flex flex-column gap-4">
                <div class="text-center py-5">
                    <div class="spinner-border text-info" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <jtool-footer></jtool-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/i18n.js?v=3"></script>
    <script>
        const historicalVersions = ['v2.8.3', 'v2.8.2'].sort(compareVersionsDesc);
        const ALL_VERSIONS = 'all';
        let activeVersion = resolveInitialVersion();
        let loadedChangelogs = {};

        function compareVersionsDesc(a, b) {
            const pa = a.replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0);
            const pb = b.replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0);
            for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const diff = (pb[i] || 0) - (pa[i] || 0);
                if (diff !== 0) return diff;
            }
            return 0;
        }

        function resolveInitialVersion() {
            const hash = decodeURIComponent(window.location.hash.replace('#', ''));
            if (hash === ALL_VERSIONS || historicalVersions.includes(hash)) return hash;
            return historicalVersions[0];
        }

        async function initHistoricalChangelogs() {
            renderVersionTabs();
            await loadAllVersions();
            renderActiveVersion();
        }

        function selectVersion(ver) {
            activeVersion = ver;
            history.replaceState(null, '', `#${ver}`);
            renderVersionTabs();
            renderActiveVersion();
        }

        function renderVersionTabs() {
            const tabsContainer = document.getElementById('versionTabs');
            tabsContainer.innerHTML = '';
            const entries = historicalVersions.map((ver, idx) => ({ id: ver, label: ver, isLatest: idx === 0 }));
            entries.push({ id: ALL_VERSIONS, label: 'All Versions', isLatest: false });
            entries.forEach(entry => {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isActive = entry.id === activeVersion;
                btn.className = `btn rounded-pill px-4 py-2 d-inline-flex align-items-center gap-1 ${isActive ? 'btn-info text-dark fw-bold' : 'btn-outline-secondary'}`;
                const icon = entry.id === ALL_VERSIONS ? 'library_books' : 'sell';
                const latestBadge = entry.isLatest ? '<span class="badge bg-success ms-1">Latest</span>' : '';
                btn.innerHTML = `<span class="material-icons fs-6">${icon}</span> ${entry.label}${latestBadge}`;
                btn.onclick = () => selectVersion(entry.id);
                tabsContainer.appendChild(btn);
            });
        }

        async function loadAllVersions() {
            const lang = document.documentElement.lang || 'en';
            await Promise.all(historicalVersions.map(async ver => {
                try {
                    let url = `/changelogs/history/${ver}.txt`;
                    if (lang !== 'en') {
                        url = `/changelogs/history/${ver}_${lang}.txt`;
                    }

                    let res = await fetch(url);
                    if (!res.ok && lang !== 'en') {
                        res = await fetch(`/changelogs/history/${ver}.txt`);
                    }

                    if (res.ok) {
                        const txt = await res.text();
                        loadedChangelogs[ver] = parseChangelogText(txt);
                    }
                } catch (e) {
                    console.error('Error loading historical version:', ver, e);
                }
            }));
        }

        function getSearchValue() {
            return document.getElementById('historicalSearchInput').value.toLowerCase().trim();
        }

        function renderActiveVersion() {
            const container = document.getElementById('historicalChangelogContainer');
            const searchVal = getSearchValue();
            const versionsToRender = (activeVersion === ALL_VERSIONS || searchVal) ? historicalVersions : [activeVersion];
            container.innerHTML = '';

            versionsToRender.forEach(ver => renderVersion(container, ver, searchVal, versionsToRender.length > 1));

            if (container.children.length === 0) {
                const scope = versionsToRender.length > 1 ? 'any version' : activeVersion;
                container.innerHTML = `<div class="custom-card p-5 text-center text-secondary"><span class="material-icons fs-1 mb-2">search_off</span><p class="mb-0">No matching updates found for "${escapeHtml(searchVal)}" in ${scope}.</p></div>`;
            }
        }

        function renderVersion(container, ver, searchVal, skipIfEmpty) {
            const sections = loadedChangelogs[ver];
            if (!sections) {
                if (!skipIfEmpty) {
                    container.insertAdjacentHTML('beforeend', `<div class="alert alert-danger text-center p-4">Unable to load release notes for ${ver}.</div>`);
                }
                return;
            }

            const cards = [];
            let verText = ver;
            sections.forEach(sec => {
                if (sec.title === 'Version') {
                    if (sec.items.length > 0) verText = sec.items[0].replace(/^-\s*/, '');
                    return;
                }

                const filteredItems = sec.items.filter(item => {
                    if (!searchVal) return true;
                    return item.toLowerCase().includes(searchVal) || sec.title.toLowerCase().includes(searchVal) || ver.toLowerCase().includes(searchVal);
                });

                if (filteredItems.length === 0) return;
                cards.push(buildSectionCard(sec.title, filteredItems));
            });

            if (cards.length === 0 && (skipIfEmpty || searchVal)) return;

            const verBanner = document.createElement('div');
            verBanner.className = 'custom-card card-highlight p-4 text-center mb-2';
            verBanner.id = `version-${ver}`;
            verBanner.innerHTML = `<h2 class="h4 fw-bold text-info mb-0 d-flex align-items-center justify-content-center gap-2"><span class="material-icons text-info fs-4">history</span> Version ${verText}</h2>`;
            container.appendChild(verBanner);
            cards.forEach(card => container.appendChild(card));
        }

        function buildSectionCard(title, items) {
            const card = document.createElement('div');
            card.className = 'custom-card p-4 p-md-5';

            let badgeColor = 'bg-primary';
            let badgeIconName = 'rocket_launch';
            if (title.includes('Minor')) {
                badgeColor = 'bg-info text-dark';
                badgeIconName = 'auto_awesome';
            } else if (title.includes('Bug')) {
                badgeColor = 'bg-warning text-dark';
                badgeIconName = 'build';
            }

            let html = `<div class="d-flex align-items-center gap-2 mb-4">
                <span class="badge ${badgeColor} fs-6 px-3 py-2 rounded-pill d-inline-flex align-items-center gap-2"><span class="material-icons fs-6">${badgeIconName}</span> ${title}</span>
            </div>`;

            html += `<ul class="feature-list mb-0">`;
            items.forEach(item => {
                const cleanItem = item.replace(/^-\s*/, '');
                const parts = cleanItem.split(': ');
                if (parts.length > 1) {
                    html += `<li><strong class="strong-text">${parts[0]}:</strong> ${parts.slice(1).join(': ')}</li>`;
                } else {
                    html += `<li>${cleanItem}</li>`;
                }
            });
            html += `</ul>`;

            card.innerHTML = html;
            return card;
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value;
            return div.innerHTML;
        }

        function filterHistoricalNotes() {
            renderActiveVersion();
        }

        function parseChangelogText(rawText) {
            const lines = rawText.split('\n');
            const sections = [];
            let currentSection = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                    const title = trimmed.substring(1, trimmed.length - 1);
                    currentSection = { title, items: [] };
                    sections.push(currentSection);
                } else if (currentSection) {
                    currentSection.items.push(trimmed);
                }
            });

            return sections;
        }

        document.addEventListener('DOMContentLoaded', initHistoricalChangelogs);
    </script>
</body>
</html>
