<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="changelog_title">JTools - App Changelog & Release Notes</title>
    <link rel="icon" type="image/png" href="/512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css?v=3">
    <script src="/scripts/components.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <jtool-navbar></jtool-navbar>

    <main class="container flex-grow-1" style="padding-top: 100px;">
        <header class="custom-card p-4 text-center my-4 shadow-sm">
            <h1 class="display-5 fw-bold mb-2"><span class="text-info">J</span>Tools Release Notes</h1>
            <p class="lead text-secondary mx-auto mb-3" style="max-width: 650px;" data-i18n="changelog_subtitle">
                Stay up to date with the latest features, improvements, and bug fixes in JTools.
            </p>
            <a href="/historical-changelogs" class="btn btn-outline-info rounded-pill px-4 py-2 d-inline-flex align-items-center gap-2">
                <span class="material-icons">history</span> <span data-i18n="nav_historical_changelogs">Historical Release Notes</span> ➜
            </a>
        </header>

        <section class="my-4">
            <div id="changelogContainer" class="d-flex flex-column gap-4">
                <div class="text-center py-5">
                    <div class="spinner-border text-info" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <jtool-footer></jtool-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/i18n.js?v=3"></script>
    <script>
        async function loadChangelogData() {
            const container = document.getElementById('changelogContainer');
            try {
                const lang = document.documentElement.lang || 'en';
                let url = '/changelogs/changelog.txt';
                if (lang !== 'en') {
                    url = `/changelogs/changelog_${lang}.txt`;
                }

                let response = await fetch(url);
                if (!response.ok && lang !== 'en') {
                    response = await fetch('/changelogs/changelog.txt');
                }

                if (!response.ok) throw new Error('Failed to load changelog text');
                const text = await response.text();

                const sections = parseChangelogText(text);
                container.innerHTML = '';

                sections.forEach(sec => {
                    if (sec.title === 'Version') {
                        if (sec.items.length === 0) return;
                        const verBanner = document.createElement('div');
                        verBanner.className = 'custom-card card-highlight p-4 text-center mb-4';
                        const verText = sec.items[0].replace(/^-\s*/, '');
                        verBanner.innerHTML = `<h2 class="h4 fw-bold text-info mb-0 d-flex align-items-center justify-content-center gap-2"><span class="material-icons text-info fs-4">sell</span> Version ${verText}</h2>`;
                        container.appendChild(verBanner);
                        return;
                    }

                    const card = document.createElement('div');
                    card.className = 'custom-card p-4 p-md-5';

                    let badgeColor = 'bg-primary';
                    let badgeIconName = 'rocket_launch';
                    if (sec.title.includes('Minor')) {
                        badgeColor = 'bg-info text-dark';
                        badgeIconName = 'auto_awesome';
                    } else if (sec.title.includes('Bug')) {
                        badgeColor = 'bg-warning text-dark';
                        badgeIconName = 'build';
                    }

                    let html = `<div class="d-flex align-items-center gap-2 mb-4">
                        <span class="badge ${badgeColor} fs-6 px-3 py-2 rounded-pill d-inline-flex align-items-center gap-2"><span class="material-icons fs-6">${badgeIconName}</span> ${sec.title}</span>
                    </div>`;

                    html += `<ul class="feature-list mb-0">`;
                    sec.items.forEach(item => {
                        const cleanItem = item.replace(/^-\s*/, '');
                        const parts = cleanItem.split(': ');
                        if (parts.length > 1) {
                            html += `<li><strong class="strong-text">${parts[0]}:</strong> ${parts.slice(1).join(': ')}</li>`;
                        } else {
                            html += `<li>${cleanItem}</li>`;
                        }
                    });
                    html += `</ul>`;

                    card.innerHTML = html;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = `<div class="alert alert-danger text-center p-4">Unable to load release notes at this time.</div>`;
            }
        }

        function parseChangelogText(rawText) {
            const lines = rawText.split('\n');
            const sections = [];
            let currentSection = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                    const title = trimmed.substring(1, trimmed.length - 1);
                    currentSection = { title, items: [] };
                    sections.push(currentSection);
                } else if (currentSection) {
                    currentSection.items.push(trimmed);
                }
            });

            return sections;
        }

        document.addEventListener('DOMContentLoaded', loadChangelogData);
    </script>
</body>
</html>
